name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # stripped aarch64 --profile dist 二进制体积上限（字节）。
  # 2026-10-13 macOS 实测 49.4 MB（批次 5 + 6 的语法，Kotlin / C# / Swift 三个占了大头）。
  # 要超过它，先按 CLAUDE.md 的依赖准入写明增量（超过 200 KB 单独写决策记录），再调这里。
  # 想压回去看 docs/决策/0001-语法支持.md「补充（批次 6）」里的实测清单（opt-level = "z" 一项就省 4.14 MB）。
  BINARY_BUDGET_BYTES: "52000000"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # tools/check_git_deadlines.py 依赖 target/release 产物，另需一次 release 构建，暂不放进 CI。
      - name: build dist
        run: cargo build --profile dist --locked
      - name: 体积预算
        run: |
          size=$(stat -f%z target/dist/workspace-editor)
          echo "binary: ${size} bytes (budget ${BINARY_BUDGET_BYTES})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$BINARY_BUDGET_BYTES" ]; then
            echo "::error::dist 二进制 ${size} 字节，超过预算 ${BINARY_BUDGET_BYTES}"
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
