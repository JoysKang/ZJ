[package]
name = "workspace-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
workspace-editor-core.workspace = true
workspace-editor-git.workspace = true
workspace-editor-agent.workspace = true
workspace-editor-agent-history.workspace = true
libc = "0.2"
# Already in the tree through GPUI Kit; used to build the syntax theme in Kit's JSON shape.
serde_json = "1"
# Already compiled in through GPUI Kit's tree-sitter-diff feature; used to re-register the
# diff grammar with add/remove captures.
tree-sitter = "0.26"
tree-sitter-diff = "0.1"
# Already in GPUI Kit's dependency tree; native FSEvents and a bounded async wakeup.
notify = "=7.0.0"
async-channel = "=2.5.0"
# Already in GPUI Kit's tree (its editor speaks LSP types); go to definition answers in them.
lsp-types = "=0.97.0"
# Already in GPUI Kit's tree (gpui-base, gpui-pre) with default features: full-text search.
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in GPUI's macOS tree; NSFileManager moves deleted files to the Trash.
objc2 = "0.6"

[lints]
workspace = true
