[workspace]
members = ["crates/app", "crates/core", "crates/git_service", "crates/agent_client", "crates/agent_bridge", "crates/agent_history"]
default-members = ["crates/app"]
# 打过补丁的 GPUI macOS 渲染 / 窗口 crate，不作为工作区成员（不跑本项目的 fmt / clippy）。
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
workspace-editor-core = { path = "crates/core" }
workspace-editor-git = { path = "crates/git_service" }
workspace-editor-agent = { path = "crates/agent_client" }
workspace-editor-agent-history = { path = "crates/agent_history" }
workspace-editor-agent-bridge = { path = "crates/agent_bridge" }
gpui-kit = { version = "=0.7.1", features = [
    # 首批（ADR 0001）：Rust、Markdown、Diff、Python、TOML、YAML、Bash、JS/TS/TSX、Go、HTML、CSS，
    # 以及批次 4 的 C / C++ / Java / SQL。
    "tree-sitter-rust", "tree-sitter-diff", "tree-sitter-markdown", "tree-sitter-python",
    "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-bash", "tree-sitter-javascript",
    "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-go", "tree-sitter-html",
    "tree-sitter-css", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-sql",
    # 批次 5（ADR 0001 补充）：常见语言与构建文件。
    "tree-sitter-ruby", "tree-sitter-php", "tree-sitter-zig", "tree-sitter-make",
    # 批次 6（ADR 0001 补充）：Kit 给 Swift / C# / CMake / Proto 的是空高亮查询，ZJ 自己注册
    # 语法 crate 自带的查询（`languages::register`）；Kotlin / Lua 用 Kit 自带的查询。
    "tree-sitter-csharp", "tree-sitter-swift", "tree-sitter-kotlin", "tree-sitter-lua",
    "tree-sitter-cmake", "tree-sitter-proto",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"

[profile.release]
debug = 1

# 发布与体积测量专用：cargo build --profile dist
# opt-level = "s"：体积 −3.57 MB（35.46 → 31.89 MB 实测）；冷启动到窗口出现 33 → 40 ms，
# 远低于 250 ms 预算。panic = "abort"：再 −3.52 MB（→ 28.37 MB 实测）。已核实运行期唯一
# 的 catch_unwind 在 gpui-base text_selection.rs，是“弹出作用域栈后 resume_unwind”的清理
# 模式，panic 本来就活不下去，abort 只少一次无意义的清理；冒烟验证（启动、欢迎页渲染、
# 空闲）正常。
[profile.dist]
inherits = "release"
debug = 0
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = 1

# GPUI 0.3.8 的 macOS 渲染器 / 窗口层与 gpui-base 0.7.1：保留 ZJ 的本地补丁，
# 原版本、改动和测量方法见 vendor/README.md 与 docs/决策/0005-渲染内存.md。
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-base = { path = "vendor/gpui-base" }

# Agent 相关依赖原来单独按体积优化（docs/决策/0004-Agent与历史.md）：dist 已整体 opt-level = "s"，
# 逐包覆盖不再需要。
